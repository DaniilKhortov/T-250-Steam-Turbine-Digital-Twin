<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Input Layout</title>
    <link rel="stylesheet" href="styleCalc.css">
</head>
<body>
    <!-- 3D модель -->
    <section class="model-section">
        <canvas class="canvas"></canvas>
    </section>
    <div class="fixed-bottom">
        <div class="all-section">
            <div class="header">
                <!-- <h2>Обчислення</h2>-->
                <h2 id="res">SCADA турбіни</h2>
            </div>
        <div class="svg-section">
            <div class="svg-container">
                <!-- SVG <div class="svg-background-section"></div>-->
                <object data="/static/picture/scada_scheme.svg" type="image/svg+xml" class="svg-content"></object>
        
                <input type="number" class="svg-input" id="cut_out" placeholder="1 = відкрито, 0 = закрито"
                    style=" top: 41%; left: 52%; " value="1" min="0" max="1">
        
                <input type="number" id="Vt_percent" class="svg-input" value="80" style=" top: 65%; left: 14%; " min="0"
                    max="100" step="1">
        
                <input type="number" id="UP_percent" class="svg-input" value="20" style=" top: 29%; left: 45%; " min="0"
                    max="100" step="1">
                <input type="number" class="svg-input" style=" top: 61.5%; left: 75.5%; " id="t2" value="40" min="-273.15">
                <input type="number" class="svg-input" style=" top: 64.5%; left: 75.5%; " id="G_sv" value="4500" min="0">
                <input type="number" class="svg-input" style=" top: 90%; left: 49%;" id="Bypass_percent" value="0" min="0"
                    max="100" step="1">
        
                <p class="svg-otput" style="top: 11%; left: 24.5%; " id="G0"> G0</p>
                <p class="svg-otput" style="top: 8%; left: 24.5%; " id="p0">p0</p>
                <p class="svg-otput" style="top: 5%; left: 24.5%; " id="t0">t0</p>
        
                <p class="svg-otput" style=" position: absolute; top: 47%; left: 19%; " id="t_tm">tтм</p>
                <p class="svg-otput" style=" position: absolute; top: 55.5%; left: 26%; " id="N_tp">Nтп</p>
                <p class="svg-otput" style=" position: absolute; top: 64%; left: 30%; " id="t1">t1</p>
        
        
                <p class="svg-otput" style=" position: absolute; top: 61%; left: 37%; " id="G_psg2">Gпсг-2</p>
                <p class="svg-otput" style=" position: absolute; top: 64%; left: 37%; " id="t_psg2">tпсг-2</p>
                <p class="svg-otput" style=" position: absolute; top: 78%; left: 44.5%; " id="G_bypass">Gбайпас</p>
        
                <p class="svg-otput" style=" position: absolute; top: 58.5%; left: 52%; " id="pt">pt</p>
                <p class="svg-otput" style=" position: absolute; top: 14%; left: 96.5%; " id="Ne">Ne</p>
                <p class="svg-otput" style=" position: absolute; top: 53%; left: 8%; " id="Bt">Bт</p>
            </div>
